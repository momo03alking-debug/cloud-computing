services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://storing_user:storing_pass@db:5432/storing_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storing_user
      POSTGRES_PASSWORD: storing_pass
      POSTGRES_DB: storing_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storing_user -d storing_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: